site_name: AI From Silicon to Intelligence
site_description: Encyclopédie technique de l’intelligence artificielle moderne, des transistors aux systèmes.
site_url: https://mistral400.github.io/AI-From-Silicon-to-Intelligence/
repo_url: https://github.com/mistral400/AI-From-Silicon-to-Intelligence
repo_name: mistral400/AI-From-Silicon-to-Intelligence
docs_dir: book
site_dir: site
strict: true
theme:
  name: material
  language: fr
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - attr_list
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
nav:
  - Accueil: index.md
  - Table des matières: table-of-contents.md
  - Fondations:
      - De l’électricité au bit: part-01-foundations/electricity-to-bit.md
      - Binaire et entiers: part-01-foundations/binary-and-integer-encoding.md
      - Transistors et circuits logiques: part-01-foundations/transistors-logic-sequential.md
      - CPU, GPU et accélérateurs: part-01-foundations/cpu-gpu-accelerators.md
      - Mémoire et bande passante: part-01-foundations/memory-hierarchy.md
      - Calcul matriciel: part-01-foundations/matrix-computation.md
  - Mathématiques:
      - Vecteurs, matrices et tenseurs: part-01-foundations/vectors-matrices-tensors.md
      - Fonctions, dérivées et gradients: part-01-foundations/functions-derivatives-gradients.md
      - Descente de gradient et optimisation: part-01-foundations/gradient-descent-optimization.md
  - Gabarit de chapitre: chapter-template.md
